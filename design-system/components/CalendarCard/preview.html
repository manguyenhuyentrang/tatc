<!doctype html>
<html>
<head><meta charset="utf-8"><title>CalendarCard — preview</title></head>
<body>
<div id="root" class="tp-stack" style="padding:12px;max-width:390px;background:var(--surface-page)"></div>
<script>
  var T = window.TuPhap, h = React.createElement;
  function Demo(pr) { var s = React.useState(pr.mode), d = React.useState(26);
    return h(T.CalendarCard, { monthLabel: 'Tháng 10, 2026', mode: s[0], onModeChange: s[1], offset: 3, days: 31, week: [26, 27, 28, 29, 30, 31, 1], selected: d[0], onSelect: d[1], today: 23, eventDays: [26, 28] }); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(Demo, { mode: 'month' }), h(Demo, { mode: 'week' })));
</script>
</body>
</html>
