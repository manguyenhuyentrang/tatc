<!doctype html>
<html>
<head><meta charset="utf-8"><title>BottomNav — preview</title></head>
<body>
<div id="root" style="max-width:390px;padding-top:30px"></div>
<script>
  var T = window.TuPhap, h = React.createElement;
  function Demo() {
    var s = React.useState('home');
    return h(T.BottomNav, { active: s[0], onChange: function (k) { if (k !== 'new') s[1](k); }, items: [
      { key: 'home', icon: 'home', label: 'Trang chủ' }, { key: 'cases', icon: 'folder', label: 'Hồ sơ' },
      { key: 'new', icon: 'filePlus', label: 'Nộp đơn', primary: true },
      { key: 'inbox', icon: 'mail', label: 'Hộp thư' }, { key: 'me', icon: 'user', label: 'Cá nhân' } ] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
