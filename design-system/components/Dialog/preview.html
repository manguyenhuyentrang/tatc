<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div id="root" class="tp-stack" style="max-width:390px;padding:0"></div>
<script>
  var T = window.TuPhap, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { position: 'relative', height: '480px', overflow: 'hidden', borderRadius: '16px', background: 'var(--surface-page)' } },
      h(T.Dialog, { inline: true, variant: 'center', title: 'Khiếu nại hành chính', onClose: function () {} },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', padding: '12px', borderRadius: '13px', boxShadow: 'inset 0 0 0 1px var(--border)' } },
          h('div', { className: 'tp-field-label' }, '1 · Chữ ký số'), h(T.Button, { block: true, icon: 'send' }, 'Ký số')))));
</script>
</body>
</html>
