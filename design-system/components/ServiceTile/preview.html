<!doctype html>
<html>
<head><meta charset="utf-8"><title>ServiceTile — preview</title></head>
<body>
<div id="root" class="tp-tile-grid tp-tile-grid-illo" style="padding:16px;max-width:390px"></div>
<script>
  var T = window.TuPhap, h = React.createElement;
  var items = [['nopDon','Nộp đơn khởi kiện'],['traCuuHoSo','Tra cứu hồ sơ',2],['lichXetXu','Lịch xét xử'],['xetXuTrucTuyen','Xét xử trực tuyến'],['tongDat','Văn bản tống đạt',1],['trichLuc','Trích lục bản sao'],['khieuNai','Khiếu nại, tố cáo'],['lichTiepDan','Lịch tiếp dân']];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items.map(function (x) { return h(T.ServiceTile, { key: x[1], illustration: x[0], label: x[1], count: x[2] }); })));
</script>
</body>
</html>
